<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vivr</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#7C3AED"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F4F4F5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7C3AED,#A78BFA);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:#fff}
.logo-name{font-size:1.5rem;font-weight:800;color:#0F0F0F;letter-spacing:-.04em}
.logo-name span{color:#7C3AED}
</style>
</head>
<body>
<div class="logo">
  <div class="logo-box">v</div>
  <div class="logo-name">vi<span>vr</span></div>
</div>

<script>
window.location.href = 'app/financeiro/';

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(){});
}
</script>
</body>
</html>
